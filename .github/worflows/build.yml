name: Windows build and tests

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: windows-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install app and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest pyinstaller

      - name: Compile Python sources
        run: python -m compileall -q app.py formbuilder tests

      - name: Run tests
        run: python -m pytest -q

      - name: Build standalone Windows executable
        run: >-
          pyinstaller --noconfirm --clean --onefile --windowed
          --name FormBuilder
          --collect-all PySide6
          --collect-all pymupdf
          --collect-all acroforge
          --add-data "samples;samples"
          app.py

      - name: Upload Windows executable
        uses: actions/upload-artifact@v7
        with:
          name: FormBuilder-Windows-${{ github.sha }}
          path: dist/FormBuilder.exe
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub Release for version tags
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/FormBuilder.exe
